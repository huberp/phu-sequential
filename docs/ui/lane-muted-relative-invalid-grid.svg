<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" font-family="sans-serif">
  <title>Lane sketch: muted lane, relative velocity, invalid text grid entry</title>
  <style>
    .bg{fill:#1e1f24} .cap{fill:#9aa0ac;font-size:12px}
    .ctl{fill:#2f323b;stroke:#4a4e5a;rx:4} .t{fill:#d8dae0;font-size:12px} .dim{fill:#6b6f7a;font-size:12px}
    .mute{fill:#e5534b;rx:4}
    .on{fill:#4fc3f7;rx:3} .off{fill:#3a3d46;stroke:#555;rx:3}
    .trk{fill:#262830;stroke:#3a3d46} .bar{fill:#4fc3f7;opacity:.85}
    .hund{stroke:#9aa0ac;stroke-dasharray:3 3}
    .err{fill:#e5534b;font-size:12px}
    .pos{fill:none;stroke:#f0b429;stroke-width:2;rx:4} .ptr{fill:#f0b429}
  </style>
  <rect class="bg" width="1200" height="212"/>
  <text class="cap" x="16" y="18">Lane 4 · MUTED (position keeps running) · Base Timing 1/4 dotted, 5 steps · Velocity: Relative (0–200 %) · text grid with invalid entry</text>

  <g opacity="0.55">
    <rect class="mute" x="16" y="28" width="28" height="28" style="opacity:1"/>
  </g>
  <text class="t" x="24" y="47" style="fill:#fff">M</text>
  <g opacity="0.55">
    <rect class="ctl" x="50" y="28" width="28" height="28"/><text class="t" x="60" y="47">L</text>
    <rect class="ctl" x="90" y="28" width="150" height="28"/><text class="t" x="100" y="47">Input: Chord ▾</text>
    <rect class="ctl" x="250" y="28" width="100" height="28"/><text class="t" x="260" y="47">Index: 2</text>
    <rect class="ctl" x="360" y="28" width="90" height="28" style="stroke-dasharray:4 3"/><text class="dim" x="370" y="47">Ch: –</text>
    <rect class="ctl" x="460" y="28" width="100" height="28"/><text class="t" x="470" y="47">Out Ch: 10</text>
    <rect class="ctl" x="570" y="28" width="110" height="28"/><text class="t" x="580" y="47">Transpose: +12</text>
    <rect class="ctl" x="690" y="28" width="100" height="28"/><text class="t" x="700" y="47">Gate: 150%</text>

    <rect class="ctl" x="16" y="62" width="170" height="28"/>
    <rect class="on" x="18" y="64" width="82" height="24"/>
    <text class="t" x="28" y="81" style="fill:#0b1b24">Base Timing</text><text class="t" x="118" y="81">Grid</text>
    <rect class="ctl" x="196" y="62" width="90" height="28"/><text class="t" x="206" y="81">1/4 ▾</text>
    <rect class="ctl" x="296" y="62" width="110" height="28"/><text class="t" x="306" y="81">dotted ▾</text>
    <rect class="ctl" x="416" y="62" width="100" height="28"/><text class="t" x="426" y="81">Swing: 100%</text>
    <rect class="ctl" x="526" y="62" width="90" height="28"/><text class="t" x="536" y="81">Steps: 5</text>
    <rect class="ctl" x="626" y="62" width="170" height="28"/><text class="t" x="636" y="81">Velocity: Relative ▾</text>
  </g>
  <rect class="ctl" x="806" y="62" width="378" height="28" style="stroke:#e5534b"/>
  <text class="t" x="816" y="81">1/8, 1/8t,</text><text class="err" x="880" y="81" style="text-decoration:underline">3/8</text><text class="t" x="905" y="81">, 1/4</text>
  <text class="err" x="806" y="104" style="font-size:11px">invalid entry "3/8": grid not applied, lane keeps its last valid grid</text>

  <!-- steps 5, dimmed because muted; 100 % line at y=158 (area 130..186, 200 % = full height) -->
  <g opacity="0.5">
    <rect class="on" x="16" y="108" width="225" height="16"/><rect class="trk" x="16" y="130" width="225" height="56"/><rect class="bar" x="16" y="158" width="225" height="28"/><text class="t" x="22" y="176" style="fill:#0b1b24">100 %</text>
    <rect class="on" x="247" y="108" width="225" height="16"/><rect class="trk" x="247" y="130" width="225" height="56"/><rect class="bar" x="247" y="144" width="225" height="42"/><text class="t" x="253" y="164" style="fill:#0b1b24">150 %</text>
    <rect class="off" x="478" y="108" width="225" height="16"/><rect class="trk" x="478" y="130" width="225" height="56"/>
    <rect class="on" x="709" y="108" width="225" height="16"/><rect class="trk" x="709" y="130" width="225" height="56"/><rect class="bar" x="709" y="172" width="225" height="14"/><text class="t" x="715" y="182" style="fill:#0b1b24">50 %</text>
    <rect class="on" x="940" y="108" width="238" height="16"/><rect class="trk" x="940" y="130" width="238" height="56"/><rect class="bar" x="940" y="130" width="238" height="56"/><text class="t" x="946" y="146" style="fill:#0b1b24">200 %</text>
    <line class="hund" x1="16" y1="158" x2="1178" y2="158"/>
  </g>
  <text class="dim" x="16" y="206">muted: no notes sent, sounding notes released, latch cleared; dashed line = 100 % (input velocity unchanged)</text>

  <rect class="pos" x="476" y="106" width="229" height="82"/>
  <polygon class="ptr" points="587,100 595,100 591,106"/>
</svg>
