<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" font-family="sans-serif">
  <title>Lane sketch: chord-follow, base timing, incoming velocity</title>
  <style>
    .bg{fill:#1e1f24} .cap{fill:#9aa0ac;font-size:12px}
    .ctl{fill:#2f323b;stroke:#4a4e5a;rx:4} .t{fill:#d8dae0;font-size:12px} .dim{fill:#6b6f7a;font-size:12px}
    .dctl{fill:#26282f;stroke:#3a3d46;stroke-dasharray:4 3;rx:4}
    .on{fill:#4fc3f7;rx:3} .off{fill:#3a3d46;stroke:#555;rx:3}
    .trk{fill:#262830;stroke:#3a3d46} .dis{fill:#24262c;stroke:#555;stroke-dasharray:4 3}
    .pos{fill:none;stroke:#f0b429;stroke-width:2;rx:4} .ptr{fill:#f0b429}
  </style>
  <rect class="bg" width="1200" height="212"/>
  <text class="cap" x="16" y="18">Example lane (color blue) · Input: Chord-Follow (index 0) · Timing Source: Base Timing · Velocity: Incoming (drag bars disabled)</text>

  <!-- control strip 1 -->
  <rect class="ctl" x="16" y="28" width="28" height="28"/><text class="t" x="24" y="47">M</text>
  <rect class="ctl" x="50" y="28" width="28" height="28"/><text class="t" x="60" y="47">L</text>
  <rect class="ctl" x="90" y="28" width="150" height="28"/><text class="t" x="100" y="47">Input: Chord ▾</text>
  <rect class="ctl" x="250" y="28" width="100" height="28"/><text class="t" x="260" y="47">Index: 0</text>
  <rect class="dctl" x="360" y="28" width="90" height="28"/><text class="dim" x="370" y="47">Ch: –</text>
  <rect class="ctl" x="460" y="28" width="100" height="28"/><text class="t" x="470" y="47">Out Ch: 1</text>
  <rect class="ctl" x="570" y="28" width="110" height="28"/><text class="t" x="580" y="47">Transpose: 0</text>
  <rect class="ctl" x="690" y="28" width="100" height="28"/><text class="t" x="700" y="47">Gate: 100%</text>
  <rect class="ctl" x="800" y="28" width="110" height="28"/><rect x="808" y="34" width="16" height="16" rx="3" fill="#4fc3f7" stroke="#d8dae0"/><text class="t" x="832" y="47">Color ▾</text>

  <!-- control strip 2 -->
  <rect class="ctl" x="16" y="62" width="170" height="28"/>
  <rect class="on" x="18" y="64" width="82" height="24"/>
  <text class="t" x="28" y="81" style="fill:#0b1b24">Base Timing</text><text class="t" x="118" y="81">Grid</text>
  <rect class="ctl" x="196" y="62" width="90" height="28"/><text class="t" x="206" y="81">1/16 ▾</text>
  <rect class="ctl" x="296" y="62" width="110" height="28"/><text class="t" x="306" y="81">straight ▾</text>
  <rect class="ctl" x="416" y="62" width="100" height="28"/><text class="t" x="426" y="81">Swing: 25%</text>
  <rect class="ctl" x="526" y="62" width="90" height="28"/><text class="t" x="536" y="81">Steps: 8</text>
  <rect class="ctl" x="626" y="62" width="170" height="28"/><text class="t" x="636" y="81">Velocity: Incoming ▾</text>
  <rect class="ctl" x="806" y="62" width="378" height="28"/><text class="dim" x="816" y="81">text grid (editable, inactive): empty</text>

  <!-- steps: pad row + velocity drag bar area -->
  <rect class="on" x="16" y="100" width="140" height="24"/><rect class="dis" x="16" y="130" width="140" height="56"/>
  <rect class="on" x="162" y="100" width="140" height="24"/><rect class="dis" x="162" y="130" width="140" height="56"/>
  <rect class="on" x="308" y="100" width="140" height="24"/><rect class="dis" x="308" y="130" width="140" height="56"/>
  <rect class="off" x="454" y="100" width="140" height="24"/><rect class="dis" x="454" y="130" width="140" height="56"/>
  <rect class="on" x="600" y="100" width="140" height="24"/><rect class="dis" x="600" y="130" width="140" height="56"/>
  <rect class="on" x="746" y="100" width="140" height="24"/><rect class="dis" x="746" y="130" width="140" height="56"/>
  <rect class="off" x="892" y="100" width="140" height="24"/><rect class="dis" x="892" y="130" width="140" height="56"/>
  <rect class="on" x="1038" y="100" width="140" height="24"/><rect class="dis" x="1038" y="130" width="140" height="56"/>
  <text class="dim" x="16" y="206">step values unused in this mode; velocity = incoming note velocity</text>

  <!-- playback position indicator on step 3 -->
  <rect class="pos" x="306" y="98" width="144" height="90"/>
  <polygon class="ptr" points="372,92 380,92 376,98"/>
</svg>
