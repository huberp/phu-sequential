<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" font-family="sans-serif">
  <title>Lane sketch: channel mode, latch on, triplet timing, by-step velocity</title>
  <style>
    .bg{fill:#1e1f24} .cap{fill:#9aa0ac;font-size:12px}
    .ctl{fill:#2f323b;stroke:#4a4e5a;rx:4} .t{fill:#d8dae0;font-size:12px} .dim{fill:#6b6f7a;font-size:12px}
    .dctl{fill:#26282f;stroke:#3a3d46;stroke-dasharray:4 3;rx:4}
    .latch{fill:#f0b429;rx:4}
    .on{fill:#81c784;rx:3} .off{fill:#3a3d46;stroke:#555;rx:3}
    .trk{fill:#262830;stroke:#3a3d46} .bar{fill:#81c784;opacity:.85}
    .pos{fill:none;stroke:#f0b429;stroke-width:2;rx:4} .ptr{fill:#f0b429}
  </style>
  <rect class="bg" width="1200" height="212"/>
  <text class="cap" x="16" y="18">Example lane (color green) · Input: Channel 3 · Latch ON · Base Timing 1/8 triplet · Velocity: By Step (0–127)</text>

  <rect class="ctl" x="16" y="28" width="28" height="28"/><text class="t" x="24" y="47">M</text>
  <rect class="latch" x="50" y="28" width="28" height="28"/><text class="t" x="60" y="47" style="fill:#2a1d00">L</text>
  <rect class="ctl" x="90" y="28" width="150" height="28"/><text class="t" x="100" y="47">Input: Channel ▾</text>
  <rect class="dctl" x="250" y="28" width="100" height="28"/><text class="dim" x="260" y="47">Index: –</text>
  <rect class="ctl" x="360" y="28" width="90" height="28"/><text class="t" x="370" y="47">Ch: 3</text>
  <rect class="ctl" x="460" y="28" width="100" height="28"/><text class="t" x="470" y="47">Out Ch: 2</text>
  <rect class="ctl" x="570" y="28" width="110" height="28"/><text class="t" x="580" y="47">Transpose: -12</text>
  <rect class="ctl" x="690" y="28" width="100" height="28"/><text class="t" x="700" y="47">Gate: 60%</text>
  <rect class="ctl" x="800" y="28" width="110" height="28"/><rect x="808" y="34" width="16" height="16" rx="3" fill="#81c784" stroke="#d8dae0"/><text class="t" x="832" y="47">Color ▾</text>

  <rect class="ctl" x="16" y="62" width="170" height="28"/>
  <rect class="on" x="18" y="64" width="82" height="24"/>
  <text class="t" x="28" y="81" style="fill:#0b1b24">Base Timing</text><text class="t" x="118" y="81">Grid</text>
  <rect class="ctl" x="196" y="62" width="90" height="28"/><text class="t" x="206" y="81">1/8 ▾</text>
  <rect class="ctl" x="296" y="62" width="110" height="28"/><text class="t" x="306" y="81">triplet ▾</text>
  <rect class="ctl" x="416" y="62" width="100" height="28"/><text class="t" x="426" y="81">Swing: 0%</text>
  <rect class="ctl" x="526" y="62" width="90" height="28"/><text class="t" x="536" y="81">Steps: 8</text>
  <rect class="ctl" x="626" y="62" width="170" height="28"/><text class="t" x="636" y="81">Velocity: By Step ▾</text>
  <rect class="ctl" x="806" y="62" width="378" height="28"/><text class="dim" x="816" y="81">text grid (editable, inactive): empty</text>

  <!-- each step: pad, track (56 high, baseline y=186), bar height = value/127*56 -->
  <rect class="on" x="16" y="100" width="140" height="24"/><rect class="trk" x="16" y="130" width="140" height="56"/><rect class="bar" x="16" y="130" width="140" height="56"/><text class="t" x="24" y="145" style="fill:#0b1b24">127</text>
  <rect class="on" x="162" y="100" width="140" height="24"/><rect class="trk" x="162" y="130" width="140" height="56"/><rect class="bar" x="162" y="150" width="140" height="36"/><text class="t" x="170" y="165">80</text>
  <rect class="on" x="308" y="100" width="140" height="24"/><rect class="trk" x="308" y="130" width="140" height="56"/><rect class="bar" x="308" y="141" width="140" height="45"/><text class="t" x="316" y="160">100</text>
  <rect class="on" x="454" y="100" width="140" height="24"/><rect class="trk" x="454" y="130" width="140" height="56"/><rect class="bar" x="454" y="165" width="140" height="21"/><text class="t" x="462" y="180">48</text>
  <rect class="off" x="600" y="100" width="140" height="24"/><rect class="trk" x="600" y="130" width="140" height="56"/><rect class="bar" x="600" y="155" width="140" height="31" style="opacity:.3"/>
  <rect class="on" x="746" y="100" width="140" height="24"/><rect class="trk" x="746" y="130" width="140" height="56"/><rect class="bar" x="746" y="147" width="140" height="39"/><text class="t" x="754" y="165">90</text>
  <rect class="on" x="892" y="100" width="140" height="24"/><rect class="trk" x="892" y="130" width="140" height="56"/><rect class="bar" x="892" y="159" width="140" height="27"/><text class="t" x="900" y="178">64</text>
  <rect class="on" x="1038" y="100" width="140" height="24"/><rect class="trk" x="1038" y="130" width="140" height="56"/><rect class="bar" x="1038" y="136" width="140" height="50"/><text class="t" x="1046" y="152">115</text>
  <text class="dim" x="16" y="206">drag a bar to edit; value shown while dragging; off steps keep their stored value (dimmed)</text>

  <rect class="pos" x="744" y="98" width="144" height="90"/>
  <polygon class="ptr" points="812,92 820,92 816,98"/>
</svg>
