name: Generate PDF

# Renders a Markdown document to PDF (pandoc + xelatex). DejaVu fonts cover the
# arrows/symbols used in the docs; keep emoji out of the source, no TeX font has them.

on:
  workflow_call:
    inputs:
      in-md:
        description: Path to the input Markdown file
        required: true
        type: string
    outputs:
      pdf-path:
        description: Path to the generated PDF file
        value: ${{ jobs.generate-pdf.outputs.pdf-path }}
  workflow_dispatch:
    inputs:
      in-md:
        description: Path to the input Markdown file
        required: true
        type: string
        default: docs/USER_GUIDE.md

jobs:
  generate-pdf:
    name: Generate PDF from Markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pdf-path: ${{ steps.generate.outputs.pdf-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
        with:
          cache: true

      - name: Install LaTeX packages
        run: |
          tlmgr update --self
          tlmgr install svg fontspec unicode-math

      - name: Install Pandoc, librsvg and DejaVu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin fonts-dejavu

      - name: Generate PDF
        id: generate
        env:
          INPUT: ${{ inputs.in-md }}
        run: |
          OUTPUT="${INPUT%.*}.pdf"
          # Relative image paths in the Markdown resolve against its own directory.
          pandoc "$INPUT" -o "$OUTPUT" \
              --from=markdown+gfm_auto_identifiers \
              --resource-path="$(dirname "$INPUT")" \
              --pdf-engine=xelatex \
              -V geometry:margin=2cm \
              -V colorlinks=true \
              -V mainfont="DejaVu Serif" \
              -V sansfont="DejaVu Sans" \
              -V monofont="DejaVu Sans Mono"
          echo "pdf-path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: ${{ steps.generate.outputs.pdf-path }}
